name: Student Learning Operations Fixtures

on:
  push:
    branches:
      - codex/workflow-pipeline
  workflow_dispatch:
    inputs:
      workflow:
        description: "要运行的离线workflow"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - session_content
          - course_weekly
          - participation
          - tasks
          - grades
          - ielts
          - pbl
          - weekly_payload
          - weekly_drafts
          - publish

permissions:
  contents: read

jobs:
  fixture-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run selected fixture workflow in dry-run mode
        run: >-
          python pipeline/run_student_ops.py
          --workflow "${{ inputs.workflow || 'all' }}"
          --fixture tests/fixtures/student_ops/week_v1.json
          --output-dir artifacts/student_ops
          --dry-run
      - name: Upload auditable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-ops-${{ inputs.workflow || 'all' }}-${{ github.run_id }}
          path: artifacts/student_ops
          if-no-files-found: warn
