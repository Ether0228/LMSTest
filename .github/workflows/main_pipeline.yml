name: Schoology Master Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟运行一次

  # 手动触发：允许指定回溯日期和翻页数
  workflow_dispatch:
    inputs:
      target_date:
        description: '爬虫回溯日期 (YYYY-MM-DD)'
        required: false
        default: ''
      max_pages:
        description: '爬虫最大翻页数'
        required: false
        default: '2'

jobs:
  master-process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # 允许 git push grading_period.json 回 repo

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager gspread oauth2client

      # === 阶段一：爬虫抓取 ===
      - name: 4. 运行爬虫 (Scraper)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          SCHOOLOGY_COOKIES: ${{ secrets.SCHOOLOGY_COOKIES }}
          TZ: Asia/Shanghai
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          CURRENT_SEMESTER: ${{ secrets.CURRENT_SEMESTER }}
        run: python "pipeline/scraper_cloud_feishu.py"

      # === 阶段二：补全课程信息 ===
      - name: 5. 运行课程补全 (Fill Course Info)
        if: success()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          SCHOOLOGY_COOKIES: ${{ secrets.SCHOOLOGY_COOKIES }}
        run: python "pipeline/fill_course_info.py"

      # === 阶段三：缺交核验 ===
      - name: 6. 运行缺交核验 (Check Missing)
        if: success()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          FEISHU_MISSING_TABLE_ID: ${{ secrets.FEISHU_MISSING_TABLE_ID }}
          ACTIVE_SEMESTERS: ${{ secrets.ACTIVE_SEMESTERS }}
        run: python "pipeline/check_missing_sync.py"

      # === 阶段三·五：抓取 Gradebook（写 grading_period 供汇总读取）===
      - name: 6.5 抓取 Gradebook (Scrape Gradebook)
        continue-on-error: true   # 失败不阻塞后续汇总步骤
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_GRADEBOOK_TABLE_ID: ${{ secrets.FEISHU_GRADEBOOK_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          SCHOOLOGY_COOKIES: ${{ secrets.SCHOOLOGY_COOKIES }}
          SCHOOLOGY_SECTION_NIDS: ${{ secrets.SCHOOLOGY_SECTION_NIDS }}
          CURRENT_SEMESTER: ${{ secrets.CURRENT_SEMESTER }}
          FEISHU_CONFIG_TABLE_ID: ${{ secrets.FEISHU_CONFIG_TABLE_ID }}
        run: python pipeline/scrape_gradebook.py

      # === 阶段四：构建学生汇总（仪表盘数据源）===
      # 无论前面步骤是否成功都运行，确保汇总表始终是最新状态
      - name: 7. 构建学生汇总 (Build Student Summary)
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          FEISHU_MISSING_TABLE_ID: ${{ secrets.FEISHU_MISSING_TABLE_ID }}
          FEISHU_SUMMARY_TABLE_ID: ${{ secrets.FEISHU_SUMMARY_TABLE_ID }}
          FEISHU_GRADEBOOK_TABLE_ID: ${{ secrets.FEISHU_GRADEBOOK_TABLE_ID }}
          ACTIVE_SEMESTERS: ${{ secrets.ACTIVE_SEMESTERS }}
          CURRENT_SEMESTER: ${{ secrets.CURRENT_SEMESTER }}
        run: python "pipeline/build_student_summary.py"

      # === 失败通知 ===
      - name: 8. 飞书通知（仅失败时）
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "interactive",
              "card": {
                "elements": [{
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**❌ Pipeline 失败**\n\n**仓库**: ${{ github.repository }}\n**分支**: ${{ github.ref_name }}\n**触发**: ${{ github.event_name }}\n**时间**: ${{ github.run_id }}\n\n[查看详细日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                  }
                }],
                "header": {
                  "title": { "tag": "plain_text", "content": "🚨 LMS Pipeline 异常" },
                  "template": "red"
                }
              }
            }'
