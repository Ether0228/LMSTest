name: Build Student Summary

on:
  workflow_dispatch:
  schedule:
    # 东部时间 EDT (UTC-4)：8:00 / 12:00 / 16:00
    # 冬令时 EST (UTC-5) 时整体偏移 1 小时，可在 11 月后手动调整
    - cron: '0 12 * * *'   # 08:00 EDT
    - cron: '0 16 * * *'   # 12:00 EDT
    - cron: '0 20 * * *'   # 16:00 EDT

jobs:
  build-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Validate script exists
        run: |
          test -f "schoology数据转飞书/build_student_summary.py"

      - name: 5. Run summary builder
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          FEISHU_MISSING_TABLE_ID: ${{ secrets.FEISHU_MISSING_TABLE_ID }}
          FEISHU_SUMMARY_TABLE_ID: ${{ secrets.FEISHU_SUMMARY_TABLE_ID }}
        run: python "schoology数据转飞书/build_student_summary.py"
