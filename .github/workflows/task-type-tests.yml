name: Task type rule tests
on:
  pull_request:
    paths:
      - pipeline/sync_course_task_types.py
      - tests/test_task_types.py
      - .github/workflows/task-type-tests.yml
  push:
    branches: ['codex/task-type-versioning']
    paths:
      - pipeline/sync_course_task_types.py
      - tests/test_task_types.py
      - .github/workflows/task-type-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_task_types.py
