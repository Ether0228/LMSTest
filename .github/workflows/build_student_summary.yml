name: Build Student Summary

on:
  workflow_dispatch:
    inputs:
      run_missing_sync:
        description: "先运行 check_missing_sync.py（建议在换学期或大批量变更后开启）"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_scrape_gradebook:
        description: "先运行 scrape_gradebook.py 生成 section_semesters（建议开启）"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      cache_tenant_key:
        description: "写入 PostgreSQL/JSON 缓存使用的 tenant key"
        required: true
        default: "qea"
      active_semesters:
        description: "可选：覆盖活跃学期，如 2025-2026 S2（多个用逗号分隔）"
        required: false
        default: ""

jobs:
  build-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary

      - name: 4. 可选：同步缺交表
        if: ${{ github.event.inputs.run_missing_sync == 'true' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          FEISHU_MISSING_TABLE_ID: ${{ secrets.FEISHU_MISSING_TABLE_ID }}
          FEISHU_GRADEBOOK_TABLE_ID: ${{ secrets.FEISHU_GRADEBOOK_TABLE_ID }}
        run: python pipeline/check_missing_sync.py

      - name: 5. 可选：抓取 Gradebook（生成 section_semesters）
        if: ${{ github.event.inputs.run_scrape_gradebook == 'true' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_GRADEBOOK_TABLE_ID: ${{ secrets.FEISHU_GRADEBOOK_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          FEISHU_CONFIG_TABLE_ID: ${{ secrets.FEISHU_CONFIG_TABLE_ID }}
          SCHOOLOGY_COOKIES: ${{ secrets.SCHOOLOGY_COOKIES }}
          SCHOOLOGY_SECTION_NIDS: ${{ secrets.SCHOOLOGY_SECTION_NIDS }}
          SCHOOLOGY_GRADING_PERIOD: ${{ secrets.SCHOOLOGY_GRADING_PERIOD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python pipeline/scrape_gradebook.py

      - name: 6. 构建学生汇总
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          FEISHU_MISSING_TABLE_ID: ${{ secrets.FEISHU_MISSING_TABLE_ID }}
          FEISHU_SUMMARY_TABLE_ID: ${{ secrets.FEISHU_SUMMARY_TABLE_ID }}
          FEISHU_GRADEBOOK_TABLE_ID: ${{ secrets.FEISHU_GRADEBOOK_TABLE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CACHE_TENANT_KEY: ${{ github.event.inputs.cache_tenant_key }}
          ACTIVE_SEMESTERS: ${{ github.event.inputs.active_semesters }}
          CACHE_DIR: artifacts/cache
        run: |
          mkdir -p artifacts/cache
          python pipeline/build_student_summary.py

      - name: 7. 产物快检（semester 标签覆盖）
        if: always()
        run: |
          python - <<'PY'
          import glob, json
          files = glob.glob("artifacts/cache/*.json")
          total = 0
          with_sem = 0
          without_sem = 0
          prev_rows = 0
          sem_labels = {}
          for f in files:
            try:
              data = json.load(open(f, encoding="utf-8"))
            except Exception:
              continue
            for cp in data.get("courseProgress", []) or []:
              total += 1
              sem = str(cp.get("semester", "")).strip()
              if sem:
                with_sem += 1
                sem_labels[sem] = sem_labels.get(sem, 0) + 1
              else:
                without_sem += 1
              if cp.get("isCurrentSemester") is False:
                prev_rows += 1
          print("cache_files =", len(files))
          print("course_progress_rows =", total)
          print("with_semester =", with_sem)
          print("without_semester =", without_sem)
          print("isCurrentSemester_false_rows =", prev_rows)
          print("semester_labels =", sem_labels)
          PY

      - name: 8. 收集调试文件
        if: always()
        run: |
          mkdir -p artifacts/debug
          for f in pipeline/grading_period.json pipeline/section_semesters.json pipeline/category_weights.json; do
            if [ -f "$f" ]; then
              cp "$f" artifacts/debug/
            fi
          done

      - name: 9. 上传缓存产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-summary-cache-${{ github.run_id }}
          path: artifacts/cache
          if-no-files-found: warn

      - name: 10. 上传调试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-summary-debug-${{ github.run_id }}
          path: artifacts/debug
          if-no-files-found: warn
