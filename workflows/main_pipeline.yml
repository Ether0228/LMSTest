name: Schoology Master Pipeline

on:
  schedule:
    # 策略 1：学生交作业高峰期 (北京时间 17:00 - 次日 01:00) -> UTC 09:00 - 17:00
    # 每 20 分钟运行一次
    - cron: '*/20 9-16 * * *'

    # 策略 2：老师办公/查阅高峰期 (北京时间 09:00 - 17:00) -> UTC 01:00 - 09:00
    # 每 2 小时运行一次 (在每小时的第 30 分钟)
    - cron: '30 1,3,5,7 * * *'

    # 策略 3：深夜/清晨休眠期 (北京时间 01:00 - 09:00) -> UTC 17:00 - 次日 01:00
    # 每 1 小时运行一次
    - cron: '0 17-23,0 * * *'

  
  # 手动触发：允许指定回溯日期和翻页数
  workflow_dispatch:
    inputs:
      target_date:
        description: '爬虫回溯日期 (YYYY-MM-DD)'
        required: false
        default: '' 
      max_pages:
        description: '爬虫最大翻页数'
        required: false
        default: '2'

jobs:
  master-process:
    runs-on: ubuntu-latest
    # 设置最大运行时间，防止脚本卡死耗尽额度
    timeout-minutes: 20
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          pip install requests selenium webdriver-manager gspread oauth2client

      # === 阶段一：爬虫抓取 (获取新数据) ===
      - name: 4. 运行爬虫 (Scraper)
        env:
          # 飞书基础鉴权
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          
          # 表格 ID 集合
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}             # 提交记录表
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }} # 花名册
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}       # 作业库
          
          # Schoology 认证
          SCHOOLOGY_COOKIES: ${{ secrets.SCHOOLOGY_COOKIES }}
          
          # 参数与时区
          TZ: Asia/Shanghai
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: python scraper_cloud_feishu.py

      # === 阶段二：补全课程信息 (数据清洗) ===
      # 只有爬虫成功运行后，才会执行这一步
      - name: 5. 运行课程补全 (Fill Course Info)
        if: success() 
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          SCHOOLOGY_COOKIES: ${{ secrets.SCHOOLOGY_COOKIES }}
        run: python fill_course_info.py

      # === 阶段三：缺交核验 (生成报表) ===
      # 只有前两步都成功，才会执行这一步，确保数据是最新的
      - name: 6. 运行缺交核验 (Check Missing)
        if: success()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_ROSTER_TABLE_ID: ${{ secrets.FEISHU_ROSTER_TABLE_ID }}
          FEISHU_LIB_TABLE_ID: ${{ secrets.FEISHU_LIB_TABLE_ID }}
          FEISHU_MISSING_TABLE_ID: ${{ secrets.FEISHU_MISSING_TABLE_ID }}
        run: python check_missing_sync.py
